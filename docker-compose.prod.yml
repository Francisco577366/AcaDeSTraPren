# =====================================================================
#  ENTORNO DE PRODUCCION  -  las mismas imagenes que se despliegan
# =====================================================================
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Sirve para dos cosas:
#
#   1. Ensayar un despliegue antes de hacerlo. Estas imagenes son las que
#      corren en Vercel y en el servidor, asi que lo que funcione aqui
#      funciona alli.
#   2. Servir la aplicacion desde un servidor propio si algun dia se deja
#      Vercel.
#
# Diferencias con el entorno local, todas a proposito:
#
#   - NO hay contenedor de base. La base es Atlas, y la URI llega por
#     variable: si falta, el arranque falla en vez de inventarse una local.
#   - NO hay panel de administracion de la base.
#   - NO hay volumenes del codigo: la imagen lleva dentro lo que se construyo,
#     asi que lo que se prueba es exactamente lo que se despliega.
#   - Los puertos salen a la red, no a 127.0.0.1.
#
# El nombre del proyecto es distinto, asi que esto no toca nada del entorno
# local: ni sus contenedores, ni su Mongo, ni sus volumenes.
name: acade-prod

services:
  backend:
    build:
      context: ./backend
      target: prod
    container_name: acade_prod_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # Sin valor por defecto a proposito. Si falta, el arranque se para y lo
      # dice, que es mejor que levantarse en silencio contra otra base.
      MONGODB_URI: ${MONGODB_URI:?Falta MONGODB_URI (la cadena de Atlas)}
      DB_NAME: ${DB_NAME:?Falta DB_NAME}
      # En un servidor normal el pool puede ser mayor que en serverless.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?Falta CORS_ORIGIN (el dominio del frontend)}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
      USUARIO_NAME: ${USUARIO_NAME:-Usuario}
      USUARIO_EMAIL: ${USUARIO_EMAIL:-}
      USUARIO_PASSWORD: ${USUARIO_PASSWORD:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # El seed carga datos: en produccion los datos ya estan, y recargarlos
      # seria justo lo que no se quiere.
      SEED_ON_START: "false"
      TRUST_PROXY: ${TRUST_PROXY:-1}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-8}
      CURRENCY: ${CURRENCY:-USD}
      BASE_MONTHLY_FEE: ${BASE_MONTHLY_FEE:-70}
      BASE_ENROLLMENT_FEE: ${BASE_ENROLLMENT_FEE:-0}
      MONTHLY_DUE_DAY: ${MONTHLY_DUE_DAY:-5}
      AUTO_MONTHLY_CHARGES: ${AUTO_MONTHLY_CHARGES:-true}
      AUTO_CHARGES_CHECK_HOURS: ${AUTO_CHARGES_CHECK_HOURS:-6}
      BASE_RENT: ${BASE_RENT:-0}
      RENT_CURRENCY: ${RENT_CURRENCY:-USD}
      RENT_DUE_DAY: ${RENT_DUE_DAY:-5}
      BASE_STUDENT_RATE: ${BASE_STUDENT_RATE:-5}
      WEEKS_PER_MONTH: ${WEEKS_PER_MONTH:-4}
      DAYS_PER_WEEK: ${DAYS_PER_WEEK:-5}
      LIBRARY_CURRENCY: ${LIBRARY_CURRENCY:-VES}
      EXCHANGE_RATE_URL: ${EXCHANGE_RATE_URL:-https://ve.dolarapi.com/v1/dolares/oficial}
      EXCHANGE_RATE_TTL_MINUTES: ${EXCHANGE_RATE_TTL_MINUTES:-360}
      ACADEMY_START_DATE: ${ACADEMY_START_DATE:-2026-09-15}
      TZ: ${TZ:-America/Caracas}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - acade_net

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # La CSP se genera en el build con el dominio del API dentro, asi que
        # tiene que llegar aqui y no en tiempo de ejecucion.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: acade_prod_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - acade_net

networks:
  acade_net:
    driver: bridge
