# =====================================================================
#  ENTORNO LOCAL  -  para trabajar y romper cosas sin consecuencias
# =====================================================================
#
#   docker compose up -d
#
# La base es un Mongo DENTRO de Docker. La URI esta escrita aqui a mano y no
# se lee del .env a proposito: asi este entorno no puede apuntar a Atlas por
# un descuido en una variable, que es justo el accidente que hay que evitar.
#
# El nombre del proyecto es lo que lo mantiene aparte del de produccion:
# contenedores, volumenes y red propios. Los dos entornos pueden estar
# levantados a la vez sin tocarse.
name: acade-local

services:
  mongo:
    image: mongo:7.0
    container_name: acade_local_db
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      TZ: ${TZ:-America/Caracas}
    ports:
      # Atado a 127.0.0.1: el puerto se ve desde este equipo (para MongoDB
      # Compass) pero no desde la red, ni desde el wifi de la academia.
      - "127.0.0.1:${DB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    # El healthcheck ademas ARRANCA el replica set la primera vez. Hace falta
    # porque Mongo solo admite transacciones sobre un replica set, y la venta
    # de libreria usa una: descuenta stock, crea la venta y crea sus renglones,
    # y a medias dejaria el inventario mintiendo. Atlas ya es un replica set,
    # asi que esto hace que el entorno local se comporte igual que produccion
    # en vez de fallar solo aqui.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - acade_net

  backend:
    build:
      context: ./backend
      target: dev
    container_name: acade_local_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      # Fija, sin variable de por medio: este entorno habla con SU Mongo.
      # directConnection evita que el driver intente descubrir el replica set
      # por los nombres que este anuncia: hay un solo nodo y ya sabemos cual.
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      DB_NAME: ${DB_NAME:-academia}
      DB_POOL_MAX: 10
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-local-no-sirve-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-true}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@academia.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
      USUARIO_NAME: ${USUARIO_NAME:-Usuario}
      USUARIO_EMAIL: ${USUARIO_EMAIL:-}
      USUARIO_PASSWORD: ${USUARIO_PASSWORD:-}
      CURRENCY: ${CURRENCY:-USD}
      BASE_MONTHLY_FEE: ${BASE_MONTHLY_FEE:-70}
      BASE_ENROLLMENT_FEE: ${BASE_ENROLLMENT_FEE:-0}
      MONTHLY_DUE_DAY: ${MONTHLY_DUE_DAY:-5}
      AUTO_MONTHLY_CHARGES: ${AUTO_MONTHLY_CHARGES:-true}
      AUTO_CHARGES_CHECK_HOURS: ${AUTO_CHARGES_CHECK_HOURS:-6}
      BASE_RENT: ${BASE_RENT:-0}
      RENT_CURRENCY: ${RENT_CURRENCY:-USD}
      RENT_DUE_DAY: ${RENT_DUE_DAY:-5}
      BASE_STUDENT_RATE: ${BASE_STUDENT_RATE:-5}
      WEEKS_PER_MONTH: ${WEEKS_PER_MONTH:-4}
      DAYS_PER_WEEK: ${DAYS_PER_WEEK:-5}
      LIBRARY_CURRENCY: ${LIBRARY_CURRENCY:-VES}
      EXCHANGE_RATE_URL: ${EXCHANGE_RATE_URL:-https://ve.dolarapi.com/v1/dolares/oficial}
      EXCHANGE_RATE_TTL_MINUTES: ${EXCHANGE_RATE_TTL_MINUTES:-360}
      ACADEMY_START_DATE: ${ACADEMY_START_DATE:-2026-09-15}
      TZ: ${TZ:-America/Caracas}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - acade_net

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: acade_local_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_CURRENCY: ${CURRENCY:-USD}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - acade_net

  # Para mirar la base a ojo. Solo en local: en produccion un panel de
  # administracion de la base es una puerta de mas que no hace falta.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: acade_local_mongoui
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_OPTIONS_EDITORTHEME: dracula
    ports:
      - "127.0.0.1:${MONGO_UI_PORT:-8081}:8081"
    networks:
      - acade_net

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  acade_net:
    driver: bridge
